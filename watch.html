<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watch | StreamVerse</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="top-nav container">
        <a class="brand" href="index.html">
          <img src="assets/images/logo.svg" alt="StreamVerse logo" />
          <span>StreamVerse</span>
        </a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="browse.html">Browse</a>
          <a href="watch.html" class="active">Watch</a>
        </div>
        <a class="nav-cta" href="browse.html">Explore titles</a>
      </nav>
    </header>

    <main>
      <section class="watch-showcase">
        <div class="container watch-layout">
          <div class="watch-copy">
            <p class="eyebrow">Now streaming</p>
            <h1 id="watch-title">Midnight Echo</h1>
            <p id="watch-description"></p>
            <div class="watch-meta">
              <span id="watch-year"></span>
              <span id="watch-rating"></span>
              <span id="watch-genre"></span>
            </div>
            <div class="watch-actions">
              <a class="btn btn-red" href="browse.html">Play trailer</a>
              <a class="btn btn-secondary" href="browse.html">+ My list</a>
            </div>
          </div>
          <div class="watch-card">
            <img id="watch-poster" src="" alt="Movie poster" />
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
